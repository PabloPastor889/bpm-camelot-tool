<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BPM & Camelot Tool</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>BPM & CAMELOT TOOL</h1>
        <p>Herramientas Musicales</p>
    </header>

    <main>

        <section>
            <h2>BPM TAP</h2>

            <p>Marca el pulso con el ratón o la barra espaciadora</p>

            <p id="bpm">0 BPM</p>

            <button id="tapButton">TAP</button>
            <button id="resetButton">RESET</button>
        </section>

         <section>
            <h2>CAMELOT TOOL</h2>

            <label for="selectScale">Selecciona una tonalidad:</label>

<select id="selectScale">
    <option value="">-- Selecciona --</option>

    <optgroup label="Menores">
        <option value="Cm">Cm</option>
        <option value="C#m">C#m</option>
        <option value="Dm">Dm</option>
        <option value="D#m">D#m</option>
        <option value="Em">Em</option>
        <option value="Fm">Fm</option>
        <option value="F#m">F#m</option>
        <option value="Gm">Gm</option>
        <option value="G#m">G#m</option>
        <option value="Am">Am</option>
        <option value="A#m">A#m</option>
        <option value="Bm">Bm</option>
    </optgroup>

    <optgroup label="Mayores">
        <option value="C">C</option>
        <option value="C#">C#</option>
        <option value="D">D</option>
        <option value="D#">D#</option>
        <option value="E">E</option>
        <option value="F">F</option>
        <option value="F#">F#</option>
        <option value="G">G</option>
        <option value="G#">G#</option>
        <option value="A">A</option>
        <option value="A#">A#</option>
        <option value="B">B</option>
    </optgroup>
</select>

<button id="camelotButton">BUSCAR COMPATIBLES</button>

<p id="compatibleScales">Escalas compatibles</p>
</section>
    </main>

    <script src="js/script.js"></script>

</body>

</html>
